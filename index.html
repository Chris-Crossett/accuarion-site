    <title>Accuarion — AI-native financial software</title>

    <!-- SPA path-decode for GitHub Pages.
         Pairs with public/404.html. If the URL was rewritten by the 404
         redirect trick (e.g. /?/products/arcaerp), this restores the
         clean path before React Router reads it.
         Must run BEFORE the React bundle. -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(
            null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
